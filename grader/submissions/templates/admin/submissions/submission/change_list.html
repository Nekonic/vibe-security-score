{% extends "admin/change_list.html" %}
{% block content %}
  <div style="margin:8px 0 14px;padding:12px 14px;background:#f6f7fb;border:1px solid #e3e6ef;border-radius:8px">
    <strong>큐 현황</strong>
    {% for label, n in status_summary %}
      <span style="display:inline-block;margin:0 6px;padding:2px 10px;background:#fff;border:1px solid #dfe3ee;border-radius:999px">{{ label }}: <b>{{ n }}</b></span>
    {% endfor %}
  </div>
  {{ block.super }}
{% endblock %}
