{% load static %}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · One Prompt Secure Coding Challenge</title>
  <link rel="stylesheet" href="{% static 'submissions/bootstrap.min.css' %}">
  <style>body{background:#f6f7f9}</style>
</head>
<body>
  <main class="container" style="max-width:380px;margin-top:12vh">
    <h1 class="h4 mb-4 text-center">One Prompt Secure Coding Challenge</h1>

    {% if form.errors %}
      <div class="alert alert-danger py-2">아이디 또는 비밀번호가 올바르지 않습니다.</div>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label" for="id_username">아이디</label>
        <input class="form-control" id="id_username" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="id_password">비밀번호</label>
        <input class="form-control" type="password" id="id_password" name="password" autocomplete="current-password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-100" type="submit">로그인</button>
    </form>
  </main>
</body>
</html>
