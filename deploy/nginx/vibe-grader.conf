# nginx site for vibe-security-score. Put in /etc/nginx/sites-available/ and
# symlink into sites-enabled/. TLS is expected (use certbot); the HTTP block
# below is what certbot upgrades to HTTPS. gunicorn listens on 127.0.0.1:8001.

server {
    listen 80;
    server_name grader.example.com;

    # Prompts are small; keep uploads tight.
    client_max_body_size 1m;

    # Content-Security-Policy at the edge (Django has no built-in CSP). All
    # assets are self-hosted, so default-src 'self'. 'unsafe-inline' is required
    # by the inline <script>/<style> in the templates — move those to nonces to
    # drop it. (Referrer-Policy / X-Content-Type-Options come from Django.)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Static files (run `manage.py collectstatic` -> DJANGO_STATIC_ROOT).
    location /static/ {
        alias /opt/vibe-security-score/grader/staticfiles/;
        access_log off;
        expires 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Drives Django's SECURE_PROXY_SSL_HEADER so it knows the request is https.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}

# After `certbot --nginx -d grader.example.com`, certbot adds the 443 server
# block + redirects 80 -> 443. Then DJANGO_SECURE_SSL_REDIRECT stays on.
