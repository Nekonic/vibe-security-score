# --- Gates -------------------------------------------------------------------
# Functional gate: if signup/login/post don't actually work, cap the final score.
gates:
  functional:
    # Which functional sub-steps must pass for the gate to be satisfied.
    require: [signup, login, create_post]
    fail_cap: 40          # max final score allowed when the gate fails
  boot:
    # If the app never boots (port never opens), it's an automatic hard fail.
    fail_cap: 0

# --- Timeouts (seconds) ------------------------------------------------------
timeouts:
  codex_exec: 900         # Part 2: one generation run, repairs included
  container_build: 300
  app_boot: 45            # poll port 5000 up to this long
  http_request: 8         # per dynamic HTTP probe
  dynamic_total: 180      # whole dynamic phase budget
  static_total: 120

# --- Container limits (participant Flask app sandbox) ------------------------
sandbox:
  image: "vibe-sec-sandbox:latest"   # built from sandbox/Dockerfile
  base_image: "python:3.11-slim"
  app_port: 5000
  memory: "512m"
  cpus: "1.0"
  pids_limit: 256
  run_as_uid: 10001                  # non-root
  network: true                      # NEVER disable — app needs DB/HTTP
  read_only_rootfs: false            # app may write sqlite; use tmpfs for /tmp

# Operator Kali console (grader/submissions/kali_session.py). Per session: the graded
# app booted as grading boots it + a Kali box on a private network; ~/poc/<check>.py
# replays the grader's own probes (sandbox/attack/kali_poc.py) against it.
kali:
  image: "vibe-sec-attack:latest"   # build vibe-sec-kali first, then -f sandbox/attack/Dockerfile from repo root
  max_sessions: 1                   # one Kali at the booth; a session gets fresh containers every time
  io_gap_seconds: 5                 # remove a session once its page stops polling this long
  memory: "2g"
  cpus: "2"
  pids_limit: 512

# Live app preview: a logged-in user opens a graded submission's generated app in
# the browser at /submissions/<id>/app/ (reverse-proxied by the grader). One
# container per submission, booted on first visit and shared across gunicorn
# workers (docker itself is the session table — see grader/submissions/preview_session.py).
preview:
  container_prefix: "vibe-sec-preview-"
  max_containers: 8                         # concurrent preview containers
  idle_timeout_seconds: 900                 # reap a preview nobody has touched this long
  state_dir: "data/preview_sessions"        # per-submission last-used stamps
  request_timeout_seconds: 15               # per proxied request to the app

# Participant submission limits (enforced at submit time in grader/submissions/views.py).
submission:
  # Max length of the PARTICIPANT's prompt in CHARACTERS incl. whitespace (the fixed
  # system prompt is not counted). Char-based (not bytes) so Korean isn't unfairly
  # short — 1 한글 syllable = 1 char. Over-long prompts waste Codex tokens + generation
  # time, so they are rejected with a message. 0 or missing => no limit.
  max_prompt_chars: 1000

# --- Prompt efficiency ---------------------------------------------------------
# One-prompt challenge: the same security from a SHORTER participant prompt scores
# more. final = security score × multiplier, where the multiplier is 1.0 up to
# free_chars and falls linearly to min_multiplier at submission.max_prompt_chars.
# Multiplicative, so a short prompt that secures nothing gains nothing. Calibration:
# the 12-line explicit security list (594 chars) scored 94–97 → ×0.90 here, while a
# compressed prompt with the same coverage keeps more (scoring/engine/efficiency.py).
efficiency:
  enabled: true
  free_chars: 200
  min_multiplier: 0.8

# Codex runner (Part 2). ChatGPT login auth only (no API key).
codex:
  binary: "codex"                 # PATH name or absolute path on operator machine
  # Default model. EMPTY => use the ChatGPT account's default model (always valid).
  # Prefer picking a model at runtime from the admin page (채점기 설정) — that dropdown
  # is populated LIVE from the CLI's own catalog (`codex debug models`), so the value
  # is guaranteed to be a real, supported slug. The admin value wins when set; leave
  # this empty to avoid pinning a slug here that a CLI update could retire.
  model: ""
  # Reasoning effort. EMPTY => the model's own default level. Overridable at runtime
  # from the admin page; that dropdown is populated LIVE from the CLI catalog
  # (levels common to all selectable models). Passed as `-c model_reasoning_effort=…`.
  reasoning_effort: ""
  codex_home: null                # null => default ~/.codex (holds auth.json — secret)
  exec_flags:                     # passed to `codex exec` (see spec)
    # danger-full-access: no write-confinement, no network block. workspace-write
    # gates writes to the workdir, so `pip install flask` (writes to site-packages
    # OUTSIDE the workdir) fails even with network open -> the model ships code it
    # could never actually install or self-test. Full access lets it pip install /
    # run / curl freely. The generated app is still run under the Docker sandbox at
    # SCORING time; this only widens the generation step, which runs as the (already
    # unprivileged) service user on the operator's own host.
    sandbox: "danger-full-access"
    # Full bypass: skip codex's APPROVAL gate as well, not just the sandbox. Under
    # danger-full-access the filesystem sandbox is already off, but `codex exec` still
    # auto-DENIES commands its execpolicy flags as destructive (rm -rf, etc.) because
    # non-interactive mode can't prompt for approval — the model then falls back to
    # weaker commands (rmdir) or stalls mid self-test. Generation runs on the HOST as
    # the unprivileged `vibe` user (NOT in Docker; only the scoring step is
    # containerized), so danger-full-access ALREADY grants full vibe-user write access
    # — this adds no new filesystem reach, it just lets the flagged commands run.
    # When true the runner emits --dangerously-bypass-approvals-and-sandbox and OMITS
    # --sandbox (the two are mutually exclusive).
    bypass_approvals: true
    extra:
      - "--skip-git-repo-check"   # allow running in a fresh temp dir
      - "--json"                  # JSONL stream on stdout for structured parse
      - "--ignore-user-config"    # ignore operator's ~/.codex config.toml (reproducibility)
      - "--ignore-rules"          # ignore AGENTS.md / execpolicy
  # Generate-until-contract-passes loop. After the build the harvested app boots in
  # the scoring sandbox and runs the HIDDEN functional contract (scoring/contract:
  # behavior only, never a security denial). Failures go back to the same session via
  # `codex exec resume <id>` until every requirement passes; resume needs the session
  # on disk, so --ephemeral is not passed and the runner deletes the session rollout
  # itself when done. Builds, repairs and the checks themselves all share the one
  # timeouts.codex_exec budget; an app that has not passed when it runs out is a
  # generation failure and is never graded.
  contract_loop:
    enabled: true
    min_round_seconds: 60         # don't start a repair round with less time left
    check_retries: 2              # re-check the same build after a sandbox/docker error
  # Blank these env keys in the child process so generation uses the ChatGPT login only.
  blank_env: ["OPENAI_API_KEY", "CODEX_API_KEY"]
  # Extra env injected into the codex child process (and the shell commands the model
  # runs to self-test the app). PIP_BREAK_SYSTEM_PACKAGES lets `pip install` succeed on
  # PEP 668 "externally-managed" pythons (Ubuntu/Debian/Homebrew) that otherwise reject
  # every install with exit 1 -> without it the model can't install Flask or run the app.
  child_env:
    PIP_BREAK_SYSTEM_PACKAGES: "1"
  rate_limit:
    # Case-insensitive signals in stderr / JSONL error events => RateLimitError.
    signals:
      - "rate limit"
      - "rate_limit"
      - "usage limit"
      - "quota"
      - "429"
      - "too many requests"
      - "5-hour"
      - "5 hour"
    max_retries: 5
    backoff_base_seconds: 30      # exponential: base * 2**attempt, capped
    backoff_max_seconds: 3600
  # Parent dir for per-generation workdirs (codexgen_<id>_<rand>). Keep it SHORT and
  # dedicated: weak models garble long temp paths (macOS /private/var/folders/...)
  # into writes outside the workdir. Relative paths resolve against the repo root.
  workdir_base: "/tmp/vibegen"
  # The front end we ship (TASKS item 5): templates/ and static/ (board.js, Bootstrap
  # original, empty uploads/). Copied into the fresh workdir before the first
  # `codex exec`. Never overwritten afterwards: the contract compares their sha256
  # with this seed and fails the build on any change, so Codex is told to undo it.
  # Relative paths resolve against the repo root. null/"" => no seed.
  seed_dir: "codex_runner/seed"
  # Files harvested from the workdir as the generated project. Codex writes only
  # app.py (single file); templates/ and static/ are harvested as Codex left them
  # (the contract proves they equal the seed); extra .py modules are dropped. `.env`
  # is harvested so an app that reads it (and self-tested WITH it) doesn't 500 at
  # scoring where it's absent.
  # prompt.md is written by the runner (participant input).
  harvest:
    include_globs: ["app.py", "requirements.txt", ".env", "templates/**/*", "static/**/*"]
    exclude_globs: [".git/**", "__pycache__/**", "*.pyc", ".venv/**", "venv/**", "static/uploads/**"]
  # Operator-only transcript (reasoning/token/command logs). NEVER shown to
  # participants. {submission_id} is substituted.
  transcript_dir: "data/codex_transcripts/{submission_id}"
  # Redacted, participant-safe live activity log (events.jsonl) for the real-time
  # generation view. Kept in a SEPARATE tree from the operator transcript above so
  # the two never mix. {submission_id} is substituted.
  events_dir: "data/generation_events/{submission_id}"

# External CLIs. DEFAULT MODE REQUIRES the enabled tools to be installed — if any
# is missing the grader aborts with an install hint (real scoring uses the real
# tools). `--dev` (CLI) / grade_submission(dev=True) instead uses the built-in
# offline checks (local osv_snapshot.json + requests oracle) and does NOT require
# the tools — handy for development, not recommended for real scoring.
# `enabled: false` drops a tool from the required set entirely.
tools:
  # CVE scanning. Default: osv-scanner on the container's resolved (pip freeze)
  # versions. --dev: local data/osv_snapshot.json instead.
  osv_scanner:
    enabled: true
    binary: "osv-scanner"
    timeout: 60
    # Local OSV database, scanned with --offline-vulnerabilities: every grading sees
    # the same advisories and no network. Grading never refreshes it, so keep it
    # fixed for an event. Download/refresh BEFORE the event (preflight aborts if absent):
    #   OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY=data/osv_db osv-scanner scan \
    #     --offline-vulnerabilities --download-offline-databases \
    #     --lockfile requirements.txt:<any requirements.txt>
    offline_db: "data/osv_db"
    # Severity -> penalty already defined under static.dependencies.cve.
  # Secondary hardcoded-secret signal (corroborates the built-in regex check).
  gitleaks:
    enabled: true
    binary: "gitleaks"
    timeout: 60
  # Auxiliary security ruleset. Findings are reported; they corroborate but do
  # not by themselves destabilize the deterministic score.
  semgrep:
    enabled: true
    binary: "semgrep"
    ruleset: "p/security-audit"   # or a pinned local ruleset dir for reproducibility
    timeout: 120
  # Primary SQLi engine for the dynamic phase. Required outside --dev (preflight
  # aborts if missing/disabled); only --dev uses the built-in boolean/error oracle.
  sqlmap:
    enabled: true
    binary: "sqlmap"
    timebox: 25                   # per-URL wall-clock cap. Normal runs finish in ~2–6s;
                                  # this bounds the pathological worst case (3 URLs) to ~75s
                                  # instead of 180s without hurting real detections.

# Orchestrator (Part 4). Generation and scoring are both bounded-parallel.
orchestrator:
  keep_generated: true
  queue_backend: "db"             # DB table as the queue + single worker
  generation_concurrency: 5       # generation thread-pool size = HARD max concurrent Codex
                                  # sessions. Admin (채점기 설정 · codex_max_sessions) throttles
                                  # the live value within this ceiling (restart to change the ceiling).
  scoring_concurrency: 2          # bounded parallel scoring (isolated containers); tune to server CPU/RAM
  poll_interval_seconds: 2        # worker loop poll cadence for queued submissions
  pipeline_timeout_seconds: 1200  # overall per-submission cap; no stage hangs forever
  workdir_base: "data/submissions"        # per-submission working dirs (cleanup-tracked)
  container_name_prefix: "vibe-sec-dyn-"  # worker startup sweep reclaims orphans by this prefix
  retry:
    generation_max: 3             # exceed => failed + reason
    scoring_max: 2
    backoff_base_seconds: 30      # exponential: base * 2**attempt, capped
    backoff_max_seconds: 3600
  auth_failure:
    # Signals in a generation error that indicate a GLOBAL Codex auth problem
    # (operator's ChatGPT session expired) — alert operator, do NOT burn
    # per-submission retries on it.
    signals: ["not logged in", "please run codex login", "unauthorized", "session expired", "401 unauthorized"]

# Static analysis (A) — source & dependency checks, mapped to OWASP Top 10.
# Philosophy: deduct only what an attack can exploit. Configuration-only findings
# (CSP, headers, cookie flags, secrets seen in source, logging, session lifetime)
# keep running for the report but carry weight 0 (category `reference`).
static:
  checks:

    # -- A04 Cryptographic Failures --
    hardcoded_secret:
      weight: 0                     # reference: a key in source is not guessable from outside; session_forgery is the attack
      penalty_per_finding: 100      # one hardcoded secret zeroes this check
      allow_env_reference: true     # os.environ[...] / getenv => not counted here

    # -- A02 Security Misconfiguration --
    debug_true:
      weight: 0                     # reference: the spec fixes `app.run()`. Was 5.5
      penalty_per_finding: 100

    # -- A04 Cryptographic Failures --
    password_hashing:
      weight: 6
      score_strong: 100             # KDF with a random per-user salt, werkzeug, bcrypt
      score_weak_kdf: 60            # KDF with one salt for everyone, or pbkdf2 under min iterations
      score_salted_fast_hash: 30    # md5/sha with a random per-user salt
      score_weak_hash: 15           # md5/sha with no salt, or SECRET_KEY as the salt
      score_plaintext: 0
      min_pbkdf2_iterations: 100000
      score_unknown: 30             # no clear auth found (was 60 — no free pass)

    # -- A05 Injection --
    sql_parameterization:
      weight: 2
      penalty_per_raw_query: 40
      score_orm_or_parameterized: 100

    # -- A05 Injection --
    xss_template:
      weight: 0                     # reference: the templates are fixed (seed). Was 2
      penalty_per_finding: 35
      score_clean: 100

    # -- A05 Injection (XSS defense-in-depth: Content-Security-Policy) --
    # Scored in the XSS rubric category. autoescape alone (framework default) is
    # table-stakes; a CSP that constrains script sources must be demonstrated.
    csp:
      # CSP is XSS defense-in-depth, so it ranks BELOW the actual exploit probes
      # (stored_xss 5 / reflected_xss 4) rather than above them, and a miss keeps
      # partial credit — an app that is autoescape-clean and passes the live XSS
      # probes shouldn't lose the whole XSS bucket over one absent header.
      weight: 0                     # reference: a missing CSP is not exploitable by itself
      score_present: 100
      score_missing: 40

    # -- A04 Cryptographic Failures (session cookie hardening) --
    cookie_flags:
      weight: 0                     # reference: the live CSRF probe judges what SameSite actually changes
      # HttpOnly / Secure / SameSite. No baseline — missing all => 0.
      score_per_flag: 34            # 3 flags => ~100
      baseline: 0

    # -- A02 Security Misconfiguration (response hardening) --
    security_headers:
      weight: 0                     # reference: a missing header is not exploitable by itself
      # CSP / X-Frame-Options / HSTS / X-Content-Type-Options. No baseline.
      score_per_header: 25          # 4 headers => 100
      baseline: 0

    # -- A04 Cryptographic Failures (weak default secret) --
    weak_default_secret:
      weight: 0                     # reference: session_forgery proves whether the key is guessable
      # os.environ.get("SECRET_KEY", "<literal>") hardcoded fallback => weak.
      score_ok: 100
      score_weak: 0

    # -- A07 Authentication Failures (session lifetime) --
    session_timeout:
      weight: 0                     # reference: a long lifetime needs a stolen cookie first. Was 2.5 = S1+L0+I1+A0.5
      full_minutes: 30              # KISA SC 10분 권고 · SW 설계 4.1 15~30분 · PCI 8.2.8 15분
      partial_minutes: 60           # NIST 800-63B-4 AAL2 유휴 1시간
      score_full: 100
      score_partial: 50
      score_default: 0              # unset => Flask default 31 days

    # -- A08 Software or Data Integrity Failures --
    insecure_deserialization:
      weight: 4
      # pickle.loads / yaml.load(unsafe) / eval|exec on request data.
      score_clean: 100
      score_found: 0

    # -- A09 Security Logging & Alerting Failures --
    security_logging:
      weight: 0                     # reference: missing logs do not let an attack succeed
      score_full: 100               # configured + logs events
      score_partial: 50
      score_none: 0

    # NOTE: the static `ssrf_sink` check was REMOVED. Spotting an outbound fetch with a
    # non-literal URL cannot tell a guarded implementation from an exploitable one
    # without dataflow analysis, so it either false-flagged careful apps or (if the
    # guard was credited) missed real bypasses. SSRF is judged ONLY by the dynamic
    # `ssrf` probe below, which fails an app solely on a real callback it actually
    # received — a false positive there is impossible.

  dependencies:                     # A03 Software Supply Chain Failures
    weight: 1                       # pool (cve + typosquatting); only cve scores
    cve:
      # OSV scan against a LOCAL fixed snapshot for reproducibility.
      weight: 4                    # S2+L0+I1+A1(ASVS 15.2.1)
      source: "data/osv_snapshot.json"
      penalty_critical: 40
      penalty_high: 25
      penalty_medium: 0             # medium/low are listed but not deducted: no proven exploit path
      penalty_low: 0
    typosquatting:
      # Compare each requirement against a local popular-package snapshot.
      # Edit distance 1 to a popular name (but not equal) => suspect. Distance 2 was
      # too loose (legit packages within 2 edits of a popular one false-positived);
      # a single-char change is the high-signal typosquat.
      weight: 0
      popular_snapshot: "data/popular_packages.json"
      max_edit_distance: 1
      penalty_per_suspect: 50

# Dynamic analysis (B) — boot the app and attack it. Contract endpoints (JSON/form both):
#   POST /signup /login /posts · GET /posts /search /users/<id> /admin /admin/users
dynamic:
  checks:

    # weight = relative importance WITHIN the rubric category (see categories:).
    functional:
      weight: 10          # in a weight-0 category: shown, never scored; drives the functional gate
      score_all_pass: 100
      score_per_missing_step_penalty: 40

    idor_profile:            # -> auth
      weight: 7.5
      score_defended: 100
      score_leaked: 0
      # Owner can't see own phone either and nothing was denied => SKIP (no PII surface
      # to judge), never a failing score.
      # NOTE: no predictable-id penalty — the contract forces sequential ids +
      # admin=id1, so penalizing them would be a false positive (grader-imposed).

    access_control_admin:    # -> auth
      weight: 0              # reference: the spec names the admin. Critical −15 stays. Was 8
      score_defended: 100        # blocked (403/404/redirect) — no 404 "concealment" bonus:
                                 # the contract fixes /admin, so hiding it isn't a lever
      score_exposed: 0           # rendered/leaked => mandatory heavy penalty

    admin_user_mgmt:         # -> auth (BOLA on admin user-management endpoints)
      weight: 0              # reference: always defended so far. Critical −15 stays. Was 8
      score_defended: 100
      score_exposed: 0       # a normal user self-promoted via /admin/users/<id>/role

    # Spec-D decisions (research_notes/board-feature-selection/spec-d-experiment.md): luna fails
    # each 70–100% with a neutral prompt and 0% with one specific sentence. None is
    # critical: each needs victim interaction or has limited impact (CVSS Medium/Low,
    # VRT P3–P5), like rate_limiting.
    csrf_protection:         # A01 · CWE-352 · effect-based: forged cross-site form POST
      weight: 5
      # The forged POST (no token, attacker Origin/Referer) must not create a post:
      # token / Flask-WTF / strict Origin check => protected. Forgery lands server-side
      # but the session cookie is SameSite=Lax/Strict => partial (browsers block it;
      # ASVS 5.0 3.5.1 L1 wants an explicit defense). Neither => 0.
      score_protected: 100
      score_samesite_only: 50
      score_missing: 0
    open_redirect:           # A01 · CWE-601 · CVSS 5.3 · VRT P4 · ASVS 3.7.2 L2 → w 2+0.5
      weight: 2.5
      score_defended: 100
      score_backslash: 50    # blocks https:// and // but lets /\ through (browsers read it as //)
      score_exposed: 0
    csv_injection:           # A05 · CWE-1236 · CVSS 2.0 · VRT P5 · ASVS 1.2.10 L3 → w 1
      weight: 1
      score_defended: 100
      score_exposed: 0
    otp_bruteforce:          # A07 · CWE-307 · CVSS 5.3 · VRT P3–P4 · ASVS 6.6.3 L2 → w 2+0.5
      weight: 2.5
      attempts: 20           # wrong codes before the right one; ASVS: rate-limit OOB codes
      unblock_wait_seconds: 60   # after the wrong codes, wait out a tripped limiter (429)
      score_defended: 100
      score_exposed: 0
    reset_enumeration:       # A07 · CWE-204 · VRT P4 (Low) · ISMS-P 2.5.3 사례 · ASVS 6.3.8 L3 → w 1+1
      weight: 2
      score_defended: 100
      score_exposed: 0
      retry_after_5xx_seconds: 10   # a 5xx under load: ask both names again after this
    # Unlike the spec-D probes above this one is critical, but only when proven: the
    # reset-request response hands the token to whoever asked, and the probe uses it
    # to set a new password and log in. A leak it couldn't turn into a login fails
    # the check without the critical.
    reset_token_leak:        # A07 · CWE-640 · CVSS 9.3: any account taken by username alone → w 4
      weight: 4              # S4 · L0 · I0 · A0 · T0: CWE-640 is not in Top 25; no ISMS-P/ASVS item mapped yet
      score_defended: 100
      score_taken: 0         # token in the response, takeover proven → also critical −25
      score_leaked: 0        # token in the response, takeover not proven → no critical
    # The two below are takeovers too, but narrower: otp_bypass verifies a phone the
    # attacker does not own, stale_session_reuse needs an admin to delete the old
    # account first. Category points only, like otp_bruteforce.
    otp_bypass:              # A07 · CWE-287 · CVSS 5.3 · ASVS 6.6.3 L2 → w 2+0.5, same as otp_bruteforce
      weight: 2.5            # one check for "verified without the code": no code, or the code read from the cookie
      score_defended: 100
      score_exposed: 0
    stale_session_reuse:     # A07 · CWE-613 · High · ASVS 7.4.2 L1 → w 3+1
      weight: 4              # a deleted user's cookie becomes the next signup with the reused id
      score_defended: 100
      score_exposed: 0

    # Spec features that open attack surface (2026-10-30 trial: research_notes/
    # board-feature-selection/spec-b-trial.md). Each fails only on a demonstrated effect.
    private_post_access:     # A01 · CWE-639 · S3 + I1 (ISMS-P 2.6.3) + A1 (ASVS 8.2.2) + T0.5 → w 5.5
      weight: 5.5            # someone not the author reads a private post (detail/search/profile/comment)
      score_defended: 100
      score_exposed: 0
    idor_write:              # A01 · CWE-639 · S3 + I1 (ISMS-P 2.6.3) + A1 (ASVS 8.2.2) + T0.5 → w 5.5
      weight: 5.5            # another user edits or deletes someone's post or comment
      score_defended: 100
      score_exposed: 0
      detail_retries: 3      # post page read again when it does not show the post: no answer, 5xx (sqlite locked ~10s under load), 401/403/429
      retry_wait_seconds: 5
    reset_host_poisoning:    # A07 · CWE-640 · needs the victim's click → S2, nothing else mapped → w 2
      weight: 2              # a forged Host/X-Forwarded-Host puts the attacker's host in a live reset link
      score_defended: 100
      score_exposed: 0

    privilege_escalation:    # -> auth (mass-assignment: signup trusts client is_admin)
      weight: 0              # reference: signup fields are fixed. Critical −25 stays. Was 6.5
      score_defended: 100
      score_escalated: 0
      admin_fields: { is_admin: true, admin: true, role: "admin", is_staff: true }

    # NOTE: the object-level authorization (BOLA) probes `object_authorization` (post
    # edit/delete) and `comment_authorization` (comment edit/delete) were REMOVED. Both
    # had to pin a post/comment id and land an owner "positive control" before they
    # could attack, so an app that simply didn't expose those ids in a shape the probe
    # recognized was judged on grader-side discovery failures instead of on its real
    # authorization — accusing or skipping for the wrong reason. Admin/function-level
    # authorization is still covered by access_control_admin + admin_user_mgmt, and
    # object-level PII exposure by idor_profile.

    ssrf:                    # -> ai_security (LIVE SSRF via grader callback listener)
      weight: 4
      wait_seconds: 3        # poll window for an async server-side fetch
      # Positive control before crediting a defense: the preview must render the title
      # of this PUBLIC page; if it doesn't, the app may not fetch at all => skip.
      control_url: "http://example.com/"
      control_marker: "Example Domain"
      score_defended: 100
      score_vulnerable: 0    # server fetched an attacker-chosen private/host address

    stored_xss:              # -> xss
      weight: 5
      score_escaped_or_rejected: 100
      score_stored_unescaped: 0

    reflected_xss:           # -> xss
      weight: 0              # reference: the fixed search template autoescapes q. Was 4
      score_clean: 100
      score_reflected: 0

    unrestricted_upload:     # -> xss (upload sink serves attacker HTML => stored XSS)
      weight: 3.5
      score_restricted: 100
      score_unrestricted: 0

    sqli:                    # -> sqli
      weight: 0              # reference: always defended so far. Critical −25 stays. Was 4
      score_no_injection: 100
      score_injection: 0
      score_error_leak: 40       # SQL error echoed but no full injection

    transport_security:      # -> security_config (runtime headers + cookie flags)
      weight: 0
      # score is proportional to present headers/cookie-flags (see probe).

    rate_limiting:           # -> auth (brute-force defense)
      weight: 6
      attempts: 5            # 고시 제5조⑥ 해설 "예: 5회", SW 설계 2.2 "5회 이내", KISA BF 3~5회
      delay_seconds: 1.0     # a retry delay this long also counts (계정잠금 또는 재시도 지연)
      lax_attempts: 10       # limited only within 10 (PCI DSS 8.3.4) => partial
      retry_after_5xx_seconds: 10  # a 5xx failure never counted: wait, measure again
      score_lax: 50
      score_present: 100
      score_missing: 0

    weak_password_policy:    # -> auth
      weight: 3
      # Only length is judged: every standard refuses a password shorter than 8.
      # Digits-only, id-like and composition rules differ between standards.
      short_password: "Abc12!x"
      score_enforced: 100
      score_weak: 0

    auth_session_management: # -> auth (§4.5: old-password check + logout invalidation)
      weight: 2
      score_defended: 100
      score_partial: 40      # one of the two controls broken
      score_both_broken: 0   # both broken

    default_credentials:     # -> authentication (ISMS-P 2.5.4 초기·기본 비밀번호; KISA BF 상)
      weight: 0              # reference: the spec's first signup is the admin. Critical −25 stays. Was 6
      score_defended: 100
      score_exposed: 0       # an app-seeded admin logs in with a guessable password

    verbose_errors:          # -> input_validation (malformed input handling)
      weight: 0              # reference: Flask's default error pages leak nothing. Was 2.5
      score_clean: 100
      score_leaked: 0

    # LIVE PoC. weight 0: never moves a category score. Like flask-unsign, it checks
    # the non-admin test user's own session cookie against the PUBLIC list
    # probes.weak_secrets offline; with the key found it keeps that cookie's fields,
    # sets its user-id fields to the admin's and tries /admin. A key found but no
    # admin page reached is an unproven finding; /admin already open to that user is
    # access_control_admin's. Values read from the app's source are never tried: an
    # outside attacker cannot see them. A proven forgery is the critical itself.
    # A key loaded from .env (sandbox/sitecustomize.py) is the live key, so a
    # listed value there is still forged. Needs flask/itsdangerous importable;
    # otherwise it reports "판정 불가" (skipped).
    session_forgery:
      weight: 0
      forge_user_id: 1              # admin is conventionally the first row
      admin_paths: ["/admin", "/admin/users"]
      score_forged: 0
      score_safe: 100

# --- Payload / probe fixtures (kept out of logic) ----------------------------
probes:
  xss_payload: "<script>alert('xss-{marker}')</script>"
  # Multiple payloads exercise several sink contexts (script/img/svg/attr/js-url).
  xss_payloads:
    - "<script>alert('xss-{marker}')</script>"
    - "<img src=x onerror=alert('xss-{marker}')>"
    - "<svg onload=alert('xss-{marker}')>"
    - "\"><script>alert('xss-{marker}')</script>"
    - "javascript:alert('xss-{marker}')"
  sqli_payloads:
    - "1' OR '1'='1"
    - "1; DROP TABLE posts--"
    - "1 UNION SELECT 1,2,3--"
    - "%' OR '1'='1' -- "
  # Injected into /login username/phone to attempt authentication bypass.
  sqli_auth_bypass:
    - "' OR '1'='1' -- "
    - "admin' -- "
    - "' OR 1=1 -- "
  # PUBLIC wordlist of common weak SECRET_KEY values an outside attacker would try
  # (tutorial defaults, placeholders). Keep it generic: never add a value copied
  # from a graded app, or the list stops modelling what an outsider can guess.
  weak_secrets:
    - "dev-secret-key-change-me"
    - "dev-secret-change-me"
    - "dev"
    - "secret"
    - "secret-key"
    - "your-secret-key"
    - "change-me"
    - "changeme"
    - "supersecret"
    - "my-secret-key"
    - "flask-secret-key"
    - "change_me"
    - "change-me-please"
    - "your-secret-key-here"
    - "secret_key"
    - "development"
    - "super-secret-key"
    - "dev-key"
    # Tutorial-style defaults, each forged into a live admin session on a generated
    # app before it was added (2026-10-30, VM: #20 dev-secret-key, #7 development-secret-key,
  # #25 dev-secret).
    - "dev-secret-key"
    - "development-secret-key"
    - "dev-secret"
    - "dev_secret"
    - "dev_secret_key"
  # Passwords are ≥12 chars WITH upper+lower+digit+symbol so a competent app's
  # strong password policy (e.g. "min 12 chars") accepts them — otherwise signup
  # is rejected and the whole functional gate falsely fails a MORE secure app.
  # Accounts identify by username|phone. phone is the private-PII field the IDOR
  # probe keys on (digit-robust match, so app-side reformatting is fine). Korean
  # 010 + 8 digits, no separators, so apps validating `010\d{8}` accept signup.
  # NOTE: for the two SIGNED-UP accounts, DynamicContext randomizes username+phone
  # per run (see http.py) so they never collide with app-seeded demo users or the
  # prompt's example phone — the values below are just defaults/documentation.
  # App-seeded admin accounts AI apps habitually ship (default_credentials probe).
  default_credentials:
    - { username: "admin", password: "admin" }
    - { username: "admin", password: "admin123" }
    - { username: "admin", password: "password" }
    - { username: "admin", password: "1234" }
    - { username: "admin", password: "admin1234" }
  test_accounts:
    - { username: "alice", password: "Prompt!Guard2345", name: "Alice", phone: "01055012047" }
    - { username: "bob", password: "Vault!Strong2345", name: "Bob", phone: "01087654321" }
