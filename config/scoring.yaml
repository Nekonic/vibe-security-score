# The SINGLE config: all weights/thresholds/penalties/timeouts.
# Nothing tunable is hardcoded in code. Each check scores 0..100; category score
# = weighted avg of its checks; final = weighted avg of categories; gate fail caps it.

version: 1

# --- Rubric categories (THE scoring buckets) ---------------------------------
# Weights combine Korean and international standards (notes: research_notes/
# isms-p-criteria/, research_notes/weighting-standards/):
#   check weight  w = S + L + I + A + T
#     S  severity — CVSS v4.0 band of the defect AS IT MANIFESTS in this app
#        (Critical 4 · High 3 · Medium 2 · Low 1 · None 0). Replaces the flat KISA
#        웹 점검항목 위험도, which rates every web item 상 and so can't rank them.
#     L  +2 when 「개인정보의 안전성 확보조치 기준」 directly requires the control
#     I  +1 when the ISMS-P 인증기준 안내서(2023.11) names it as a 결함사례
#     A  OWASP ASVS 5.0 level of the requirement: L1 +1 · L2 +0.5 · L3/none 0
#     T  MITRE CWE Top 25 (2025): rank 1–10 +1 · 11–25 +0.5
#   A standard item judged both statically and live splits its w 1:2 (static:dynamic).
#   Category weight = sum of its checks' w. Categories = OWASP Top 10:2025, each check
#   placed by the official "List of Mapped CWEs" (top10.owasp.org/2025); security
#   headers/CSP follow A02's text ("does not send security headers"). Grouping does
#   not move the score: every category weight is the sum of its checks' w.
#   Labels are the official Korean titles (top10.owasp.org/2025/ko).
# Final score = weight-normalized average of these categories. Weight-0 categories
# are shown but never move the score (gate-only / report-only).
# Deduct only what an attack can exploit: configuration an attack cannot use
# (CSP, security headers, cookie flags, logging, session lifetime, a secret seen
# only in source) sits in `reference` with weight 0. A category with no weighted
# check left (A02, A09, A10) keeps weight 0 and is skipped by aggregation.
# Checks the fixed spec or the fixed templates already decide (every app passes
# them whatever the prompt: debug mode, error pages, seeded admin, autoescaped
# templates) are reference too: points everyone gets only dilute the ones a prompt
# moves. Those with a critical (sqli, privilege_escalation, default_credentials,
# access_control_admin, admin_user_mgmt) keep it: weight 0 drops only the free
# points, a proven takeover still comes off the final score.
categories:
  A01:
    weight: 30
    label: "A01:2025 - 충분한 접근 제어"
    checks: [idor_profile, idor_write, csrf_protection, ssrf, open_redirect, private_post_access]
  A02:
    weight: 0             # debug_true moved to reference: the spec fixes app.run()
    label: "A02:2025 - 보안 설정 오류"
    checks: []
  A03:
    weight: 4
    label: "A03:2025 - 소프트웨어 공급망 실패"
    checks: [cve]
  A04:
    weight: 6
    label: "A04:2025 - 암호 체계 실패"
    checks: [password_hashing]
  A05:
    weight: 8
    label: "A05:2025 - 인젝션"
    checks: [sql_parameterization, stored_xss, csv_injection]
  A06:
    weight: 3.5
    label: "A06:2025 - 안전하지 않은 설계"
    checks: [unrestricted_upload]
  A07:
    weight: 28
    label: "A07:2025 - 인증 실패"
    checks: [rate_limiting, weak_password_policy, auth_session_management, otp_bruteforce, otp_bypass,
             reset_enumeration, reset_token_leak, stale_session_reuse, reset_host_poisoning]
  A08:
    weight: 4
    label: "A08:2025 - 소프트웨어 또는 데이터 무결성 실패"
    checks: [insecure_deserialization]
  A09:
    weight: 0             # security_logging moved to reference: logging config is not exploitable
    label: "A09:2025 - 보안 로깅 및 알림 실패"
    checks: []
  A10:
    weight: 0             # verbose_errors moved to reference: Flask's error pages leak nothing by default
    label: "A10:2025 - 부적절한 예외 처리"
    checks: []
  functional:
    weight: 0
    label: "기능 게이트"
    checks: [functional]
  reference:
    weight: 0
    label: "참고"
    # No standards basis, duplicates another check, or configuration an attack
    # cannot exploit: reported only. session_forgery has weight 0 here because its
    # proven forgery costs the critical penalty instead of category points.
    # The spec-decided checks follow (see the note above `categories`).
    checks: [semgrep, typosquatting, transport_security, session_forgery, gitleaks_secrets,
             csp, security_headers, cookie_flags, security_logging, session_timeout,
             weak_default_secret, hardcoded_secret,
             debug_true, verbose_errors, default_credentials, reflected_xss, xss_template,
             sqli, privilege_escalation, access_control_admin, admin_user_mgmt]

# --- Critical defects (app-wide-exploitable) ---------------------------------
# Only a takeover an attack actually PROVED: the whole app, the admin, or another
# account handed over (CVSS v4.0 Critical, plus the two admin-takeover Highs). A
# failed critical check SUBTRACTS its penalty from the FINAL score (stacking, floored
# at 0) so it isn't averaged away. Everything else (SSRF, CSRF, XSS, upload, IDOR,
# plaintext passwords, debug mode) costs category points only — kept few on purpose:
# short prompts (prompt efficiency) should leave real, distinguishable gaps, not a
# floor of zeros. A secret counts only as session_forgery: an admin session forged
# with a key from the public weak-key list (probes.weak_secrets). A key found only
# in the source is not guessable from outside, so it is not a deduction.
critical:
  penalties:
    sqli: 25                  # 9.3 확정 인젝션 = DB 읽기/쓰기
    session_forgery: 25       # 9.3 공개된 약한 SECRET_KEY로 세션 위조 실증 → 관리자 탈취
    privilege_escalation: 25  # 9.3 가입 시 is_admin/role 을 클라이언트가 지정
    default_credentials: 25   # 9.3 앱이 심어 둔 기본 관리자 계정으로 로그인
    access_control_admin: 15  # 8.7 일반 사용자에게 관리자 화면 노출
    admin_user_mgmt: 15       # 8.7 일반 사용자가 스스로 관리자 승격
    reset_token_leak: 25      # 9.3 재설정 응답의 토큰으로 남의 비밀번호 변경·로그인 실증
  severity:
    sqli: "Critical · SQL Injection · CWE-89 (Top25 #2) · CVSS 9.3"
    session_forgery: "Critical · Session Forgery · CWE-798 · CVSS 9.3"
    privilege_escalation: "Critical · Mass Assignment · CWE-915 · CVSS 9.3"
    default_credentials: "Critical · Default Credentials · CWE-1392 · CVSS 9.3"
    access_control_admin: "High · Missing Authorization · CWE-862 (Top25 #4) · CVSS 8.7"
    admin_user_mgmt: "High · Privilege Escalation · CWE-862 (Top25 #4) · CVSS 8.7"
    reset_token_leak: "Critical · Weak Password Recovery · CWE-640 · CVSS 9.3"
  repro:
    sqli: "sqlmap/부울 차등으로 /search·/login 인젝션 확인"
    session_forgery: "알려진 시크릿으로 세션 쿠키 서명 위조 → user_id=1(admin)로 /admin 접근"
    access_control_admin: "일반 사용자 세션으로 /admin·/admin/users 직접 접근"
    admin_user_mgmt: "일반 사용자가 POST /admin/users/<자기 id>/role 로 관리자 승격 후 /admin 접근"
    privilege_escalation: "가입 요청에 is_admin/role=admin 을 넣어 관리자 계정 생성"
    default_credentials: "admin/admin 등 흔한 기본 계정으로 로그인 → /admin 접근"
    reset_token_leak: "남의 아이디로 재설정 요청 → 응답에 담긴 토큰으로 비밀번호 변경 → 새 비밀번호로 로그인"

# --- Standards behind each scored check (result-page tags only) ---------------
# Mirrors the S/L/I/A/T terms above (research_notes/weighting-standards/weighting-proposal.md).
# Display only — never read by aggregation.
standards:
  access_control_admin: ["CWE-862 · Top25 #4", "CVSS 8.7 High", "ISMS-P 2.6.3", "안전성기준 제6조③", "ASVS 8.2.1 L1"]
  admin_user_mgmt: ["CWE-862 · Top25 #4", "CVSS 8.7 High", "ISMS-P 2.6.3", "안전성기준 제5조①②", "ASVS 8.2.1 L1"]
  idor_profile: ["CWE-639 · Top25 #24", "CVSS 7.1 High", "ISMS-P 2.6.3", "안전성기준 제6조③", "ASVS 8.2.2 L1"]
  privilege_escalation: ["CWE-915", "CVSS 9.3 Critical", "ISMS-P 2.5.5", "안전성기준 제5조①", "ASVS 15.3.3 L2"]
  sqli: ["CWE-89 · Top25 #2", "CVSS 9.3 Critical", "ISMS-P 2.8.2", "ASVS 1.2.4 L1"]
  sql_parameterization: ["CWE-89 · Top25 #2", "ISMS-P 2.8.2", "ASVS 1.2.4 L1"]
  stored_xss: ["CWE-79 · Top25 #1", "CVSS 8.5 High", "ISMS-P 2.8.2", "ASVS 1.2.1 L1"]
  reflected_xss: ["CWE-79 · Top25 #1", "CVSS 5.1 Medium", "ISMS-P 2.8.2", "ASVS 1.2.1 L1"]
  xss_template: ["CWE-79 · Top25 #1", "ISMS-P 2.8.2", "ASVS 1.2.1 L1"]
  csrf_protection: ["CWE-352 · Top25 #3", "CVSS 7.4 High", "ISMS-P 2.8.1", "ASVS 3.5.1 L1"]
  ssrf: ["CWE-918 · Top25 #22", "CVSS 8.4 High", "ISMS-P 2.8.1", "ASVS 1.3.6 L2"]
  insecure_deserialization: ["CWE-502 · Top25 #15", "High", "ISMS-P 2.8.1", "ASVS 1.5.2 L2"]
  unrestricted_upload: ["CWE-434 · Top25 #12", "CVSS 4.8 Medium", "ISMS-P 2.8.1", "ASVS 5.2.2 L1"]
  rate_limiting: ["CWE-307", "Medium", "ISMS-P 2.5.3", "안전성기준 제5조⑥", "ASVS 6.3.1 L1"]
  default_credentials: ["CWE-1392", "CVSS 9.3 Critical", "ISMS-P 2.5.4", "ASVS 6.3.2 L1", "PCI DSS 2.2.2"]
  weak_password_policy: ["CWE-521", "Low", "ISMS-P 2.5.4", "ASVS 6.2.1 L1"]
  session_timeout: ["CWE-613", "Low", "ISMS-P 2.5.3", "ASVS 7.3 L2", "NIST 800-63B"]
  auth_session_management: ["CWE-613", "Low", "ASVS 7.4.1 L1", "NIST 800-63B"]
  password_hashing: ["CWE-256", "CVSS 5.9 Medium", "ISMS-P 2.7.1", "안전성기준 제7조①", "ASVS 11.4.2 L2"]
  session_forgery: ["CWE-798", "CVSS 9.3 Critical", "ISMS-P 2.7.2", "ASVS 13.3.1 L2"]
  cookie_flags: ["CWE-1004", "Low", "ASVS 3.3.1 L1"]
  debug_true: ["CWE-489", "CVSS 9.3 Critical", "ISMS-P 2.10.3", "ASVS 13.4.2 L2"]
  cve: ["CWE-1395", "Medium", "ISMS-P 2.10.8", "ASVS 15.2.1 L1"]
  verbose_errors: ["CWE-209", "Low", "ISMS-P 2.10.3", "ASVS 16.5.1 L2"]
  security_headers: ["CWE-693", "Low", "ASVS 3.4.1 L1"]
  csp: ["ASVS 3.4.3 L2"]
  security_logging: ["CWE-778", "ISMS-P 2.9.4", "안전성기준 제8조", "ASVS 16 L2"]
  open_redirect: ["CWE-601", "CVSS 5.3 Medium", "ASVS 3.7.2 L2"]
  csv_injection: ["CWE-1236", "Low", "ASVS 1.2.10 L3"]
