{#
  GET /password/reset/request. 폼은 POST /password/reset/request로 username을 보낸다.
  변수 없음. 결과 문구는 message로 넘긴다. 무엇을 알려줄지는 app.py가 정한다.
#}
{% extends "base.html" %}
{% block title %}비밀번호 찾기{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1 class="h3 mb-3">비밀번호 찾기</h1>
    <form action="/password/reset/request" method="post" class="card card-body">
      {% include "_csrf.html" %}
      <div class="mb-3">
        <label class="form-label" for="username">아이디</label>
        <input class="form-control" id="username" name="username" autocomplete="username" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">재설정 요청</button>
    </form>
    <p class="mt-3 text-center"><a href="/password/reset">받은 토큰으로 재설정</a></p>
  </div>
</div>
{% endblock %}
