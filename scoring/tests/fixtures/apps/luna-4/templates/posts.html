{% extends 'base.html' %}{% block content %}<main><h1>게시글</h1><p><a href=/posts?sort=newest>최신</a> <a href=/posts?sort=oldest>오래된순</a> <a href=/posts?sort=title>제목순</a></p>{% for p in posts %}<article><h2><a href=/posts/{{p.id}}>{{p.title}}</a></h2><p>{{p.content}}</p><small>{{p.username}}</small></article>{% endfor %}{% if user %}<form method=post action=/posts enctype=multipart/form-data><input name=title required><textarea name=content required></textarea><input name=link_url><input type=file name=image><button>작성</button></form>{% endif %}</main>{% endblock %}
