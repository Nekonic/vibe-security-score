{#
  GET /account/password. 폼은 POST /account/password로 old_password, new_password를 보낸다.
  변수 없음.
#}
{% extends "base.html" %}
{% block title %}비밀번호 변경{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1 class="h3 mb-3">비밀번호 변경</h1>
    <form action="/account/password" method="post" class="card card-body">
      {% include "_csrf.html" %}
      <div class="mb-3">
        <label class="form-label" for="old_password">현재 비밀번호</label>
        <input class="form-control" id="old_password" name="old_password" type="password" autocomplete="current-password" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="new_password">새 비밀번호</label>
        <input class="form-control" id="new_password" name="new_password" type="password" autocomplete="new-password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">변경하기</button>
    </form>
  </div>
</div>
{% endblock %}
