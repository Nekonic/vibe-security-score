{% extends 'base.html' %}
{% block content %}
<h2>All Users</h2>
<table border="1">
  <tr><th>id</th><th>username</th><th>phone</th><th>role</th><th>actions</th></tr>
  {% for u in users %}
    <tr>
      <td>{{ u.id }}</td>
      <td>{{ u.username }}</td>
      <td>{{ u.phone }}</td>
      <td>{{ 'admin' if u.is_admin else 'user' }}</td>
      <td>
        <form action="/admin/users/{{ u.id }}/role" method="post">
          <input name="role" value="{{ 'user' if u.is_admin else 'admin' }}">
          <button type="submit">set</button>
        </form>
        <form action="/admin/users/{{ u.id }}" method="post">
          <button formaction="/admin/users/{{ u.id }}" formmethod="post" formnovalidate>delete</button>
        </form>
      </td>
    </tr>
  {% endfor %}
</table>
{% endblock %}
