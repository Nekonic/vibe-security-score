{% extends "base.html" %}

{% block title %}로그인 - 게시판{% endblock %}

{% block content %}
  <section class="panel">
    <h1>로그인</h1>
    <form class="stack" action="{{ url_for('login') }}" method="post">
      <label>
        아이디
        <input name="username" autocomplete="username" required>
      </label>
      <label>
        비밀번호
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">로그인</button>
    </form>
  </section>
{% endblock %}
