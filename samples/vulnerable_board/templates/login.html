{% extends 'base.html' %}
{% block content %}
{% if message %}<p class="ok">{{ message }}</p>{% endif %}
{% if error %}<p class="err">{{ error }}</p>{% endif %}
{% if user %}
  <p>로그인됨: <strong>{{ user.username }}</strong></p>
  <p><a href="/users/{{ user.id }}">프로필</a></p>
{% else %}
  <h2>Login</h2>
  <form method="post" action="/login">
    <label>username or phone<input name="username" placeholder="username or phone"></label><br>
    <label>phone<input name="phone" placeholder="01012345678"></label><br>
    <label>password<input type="password" name="password"></label><br>
    <button type="submit">login</button>
  </form>
{% endif %}
<hr>
<h3>Change password</h3>
<form method="post" action="/account/password">
  <input name="old_password" placeholder="old password" type="password">
  <input name="new_password" placeholder="new password" type="password">
  <button type="submit">change</button>
</form>
{% endblock %}
