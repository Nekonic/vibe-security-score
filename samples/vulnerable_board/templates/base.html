<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}게시판{% endblock %}</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #202124;
        background: #f6f7f8;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 24px;
        background: #ffffff;
        border-bottom: 1px solid #dde1e6;
      }
      main {
        width: min(880px, calc(100% - 32px));
        margin: 32px auto;
      }
      a {
        color: #0b57d0;
        text-decoration: none;
      }
      .brand {
        font-weight: 700;
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .panel,
      .post {
        background: #ffffff;
        border: 1px solid #dde1e6;
        border-radius: 8px;
        padding: 20px;
      }
      .stack {
        display: grid;
        gap: 16px;
      }
      label {
        display: grid;
        gap: 6px;
        font-weight: 600;
      }
      input,
      textarea {
        box-sizing: border-box;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #c9ced6;
        border-radius: 6px;
        font: inherit;
      }
      textarea {
        min-height: 140px;
        resize: vertical;
      }
      button {
        width: fit-content;
        padding: 10px 14px;
        border: 0;
        border-radius: 6px;
        color: #ffffff;
        background: #0b57d0;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .link-button {
        padding: 0;
        color: #0b57d0;
        background: transparent;
        font-weight: 400;
      }
      .messages {
        display: grid;
        gap: 8px;
        margin-bottom: 16px;
        padding: 0;
        list-style: none;
      }
      .messages li {
        padding: 10px 12px;
        border-radius: 6px;
        background: #eaf2ff;
      }
      .post h3 {
        margin: 0 0 8px;
      }
      .content {
        white-space: pre-wrap;
      }
      .meta {
        margin: 0 0 12px;
        color: #5f6368;
        font-size: 0.92rem;
      }
      .empty {
        color: #5f6368;
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="{{ url_for('posts_view') }}">간단 게시판</a>
      <nav class="nav">
        {% if session.get("username") %}
          <span>{{ session["username"] }}님</span>
          <form action="{{ url_for('logout') }}" method="post">
            <button class="link-button" type="submit">로그아웃</button>
          </form>
        {% else %}
          <a href="{{ url_for('login') }}">로그인</a>
          <a href="{{ url_for('signup') }}">회원가입</a>
        {% endif %}
      </nav>
    </header>
    <main>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <ul class="messages">
            {% for message in messages %}
              <li>{{ message }}</li>
            {% endfor %}
          </ul>
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
