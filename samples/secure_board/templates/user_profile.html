{% extends 'base.html' %}
{% block content %}
<h2>{{ user['username'] }}</h2>
{% if user['avatar_url'] %}<img src="{{ user['avatar_url'] }}" alt="avatar">{% endif %}
<div>ID: {{ user['id'] }}</div>
{% if show_phone %}<div>phone: {{ user['phone'] }}</div>{% endif %}
<h3>Posts</h3>
<ul>
  {% for p in posts %}
    <li><a href="{{ url_for('post_detail', post_id=p['id']) }}">{{ p['title'] }}</a></li>
  {% endfor %}
</ul>
{% endblock %}
